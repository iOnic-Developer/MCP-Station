services:
  mcp-station:
    build: .
    image: dbzocchi/mcp-station:2.7.1
    container_name: mcp-station
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      # ── required ──
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # ── recommended ──
      SESSION_SECRET: ""
      MCP_TOKEN: ""
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      FILES_DIR: /files
      # ── assistant (can also be set in the UI) ──
      ASSISTANT_PROVIDER: openai              # openai | anthropic | gemini
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-6-astra
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-sonnet-4-6
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
    volumes:
      - ./volumes/data:/data
      - ./volumes/mcps:/app/mcps
      - ./volumes/files:/files
