name: Publish product page
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/assets/product/**', '.github/workflows/product-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: product-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}site/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate product assets
        run: REQUIRE_PRODUCT_SCREENSHOT=1 node scripts/test-product-page.mjs
      - name: Assemble static site only
        run: |
          mkdir -p _site/site _site/assets/product
          cp -R docs/site/. _site/site/
          rm -f _site/site/generate-media.mjs
          cp docs/assets/product/*.png _site/assets/product/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=site/"><title>MCP Station</title><a href="site/">Open MCP Station product page</a></html>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
