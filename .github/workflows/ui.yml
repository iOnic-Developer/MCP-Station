name: UI regression tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contracts
      - run: npm run test:browser
        if: ${{ !cancelled() }}
      - name: Upload synthetic-fixture screenshots and accessibility findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
