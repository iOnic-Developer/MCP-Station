name: Build & push to Docker Hub

# main → latest, the package.json version (e.g. 2.4.0) and a short-sha tag; a vX.Y.Z git tag → X.Y.Z.
# Tests gate every push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional beta image tag; must end in _beta. Never updates latest.'
        required: false
        default: ''
        type: string

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate manual beta tag
        if: inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+_beta$ ]] || exit 1

      - name: Install dependencies
        run: npm install

      - name: Legacy smoke suite
        run: npm test

      - name: OpenAI Responses smoke suite
        run: npm run test:openai

      - name: Dashboard syntax checks
        run: npm run test:ui

      - name: PWA and account regressions
        run: npm run test:pwa && npm run test:instances && npm run test:usage

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-station
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && inputs.image_tag == '' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && inputs.image_tag == '' }}
            type=semver,pattern={{version}}
            type=sha,prefix=,enable=${{ inputs.image_tag == '' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
