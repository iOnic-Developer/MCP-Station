name: Build & push to Docker Hub

# main → latest, the package.json version (e.g. 2.4.0) and a short-sha tag; a vX.Y.Z git tag → X.Y.Z.
# Tests gate every push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional beta tag (must end in _beta; never publishes latest)'
        required: false
        default: ''
        type: string

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate beta publication
        id: beta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$IMAGE_TAG" ]; then
            [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*_beta$ ]] || { echo 'Beta tag must end in _beta'; exit 1; }
            echo "tags=$IMAGE_OWNER/mcp-station:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != refs/heads/main ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Non-main manual builds require an explicit _beta tag'; exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Legacy smoke suite
        run: npm test

      - name: OpenAI Responses smoke suite
        run: npm run test:openai

      - name: Dashboard syntax checks
        run: npm run test:ui

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-station
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.beta.outputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
